version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # Monthly (was weekly): every npm bump touches package-lock.json, which is
      # in postgres-parity's path filter and runs the 2-job DB-container suite
      # (~18 min). Weekly version bumps were ~470 Actions-min/month. SECURITY
      # updates are unaffected — Dependabot alerts + security updates open PRs
      # immediately on detection, independent of this version-update schedule.
      # Both were OFF at the repo-settings level from this file's creation
      # until 2026-09-03 (dependabot_security_updates: disabled), so this
      # claim was false in practice for that whole window despite being true
      # of Dependabot's design — enabled via `gh api -X PUT
      # repos/{owner}/{repo}/vulnerability-alerts` +
      # `.../automated-security-fixes`; verify with `gh api
      # repos/{owner}/{repo} -q .security_and_analysis`.
      interval: "monthly"
    # Lowered from 10 → 5: with grouping below, ~2-3 PRs/week is the steady state.
    open-pull-requests-limit: 5
    groups:
      # AI provider SDKs — bumped together in one PR per week (often on the
      # same upstream cadence).  Replaces ~5 separate weekly PRs with 1.
      ai-sdks:
        patterns:
          - "@anthropic-ai/*"
          - "openai"
          - "@google/*"
        update-types:
          - "minor"
          - "patch"
      # Storage / infra SDKs — Supabase + DB drivers.
      storage:
        patterns:
          - "@supabase/*"
          - "pg"
        update-types:
          - "minor"
          - "patch"
      # Validation + general utilities — small, low-risk bumps.
      utilities:
        patterns:
          - "zod"
          - "dotenv"
          - "yaml"
          - "micromatch"
          - "proper-lockfile"
          - "codeowners-utils"
        update-types:
          - "minor"
          - "patch"
      # Dev-only deps (linters, type-checkers, AST tools) — never block prod.
      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Major-version bumps stay as their own per-package PRs (intentional —
    # they need individual review attention) by NOT being in any group above.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      gh-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
