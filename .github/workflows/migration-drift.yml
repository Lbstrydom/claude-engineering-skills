name: migration-drift

# Detects unapplied / sha-mismatched / orphan-ledger drift between
# supabase/migrations/*.sql source files and the audit_loop_migrations
# ledger in the cloud Postgres. Three triggers:
#   - weekly cron (backstop catch-all)
#   - push to main with migration changes (event-driven, minutes after merge)
#   - workflow_dispatch (manual operator trigger post-migrate)
#
# Mirrors architectural-drift.yml + memory-health.yml sticky-issue +
# auto-close pattern.
#
# Plan: docs/plans/migration-drift-detector.md §6 + §2 #6.

on:
  schedule:
    # Mondays 09:45 UTC — 15-min stagger from architectural-drift (09:30)
    # so the two don't interleave with the same AUDIT_DB_URL secret.
    - cron: '45 9 * * 1'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/setup-postgres.mjs'
      - '.github/workflows/migration-drift.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: migration-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify AUDIT_DB_URL secret
        id: secret-check
        env:
          AUDIT_DB_URL: ${{ secrets.AUDIT_DB_URL }}
        run: |
          if [ -z "$AUDIT_DB_URL" ]; then
            echo "::warning::AUDIT_DB_URL not set — skipping migration-drift check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check migration drift
        if: steps.secret-check.outputs.skip != 'true'
        id: drift
        env:
          AUDIT_DB_URL: ${{ secrets.AUDIT_DB_URL }}
          AUDIT_DB_SSL_MODE: no-verify
        run: |
          set +e
          # R1-audit M3: invoke node directly (NOT `npm run`) — npm prepends
          # its own log lines to stdout in some CI configs and breaks JSON
          # parsing downstream.
          node scripts/setup-postgres.mjs --check-drift --format json > /tmp/migration-drift.json
          EXIT=$?
          set -e
          echo "exit=$EXIT" >> "$GITHUB_OUTPUT"
          # R1-audit M2: distinguish drift (exit 1) from infra (2) and
          # needs-bootstrap (3). Only exit 1 opens/updates the sticky issue.
          # 2 and 3 fail the workflow loudly without polluting the issue tracker.
          case "$EXIT" in
            0) echo "status=green"     >> "$GITHUB_OUTPUT" ;;
            1) echo "status=triggered" >> "$GITHUB_OUTPUT" ;;
            *) echo "status=infra"     >> "$GITHUB_OUTPUT"
               echo "::error::db:check-drift exited $EXIT (infra/bootstrap issue — not opening sticky issue)"
               exit "$EXIT" ;;
          esac

      - name: Upload drift report artefact
        if: steps.secret-check.outputs.skip != 'true' && hashFiles('/tmp/migration-drift.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: migration-drift-report
          path: /tmp/migration-drift.json
          retention-days: 90

      - name: Open / update sticky issue on trigger
        if: steps.drift.outputs.status == 'triggered'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          MARKER='<!-- audit-loop:migration-drift -->'
          EXISTING=$(gh api "repos/$REPO/issues?state=open&labels=migration-drift&per_page=50" \
            --jq '[.[] | select(.body // "" | startswith("<!-- audit-loop:migration-drift -->"))][0].number' 2>/dev/null || echo '')
          # Render the JSON drift report as a markdown summary.
          {
            echo "$MARKER"
            echo ""
            echo "## Migration drift detected"
            echo ""
            echo "Source: \`supabase/migrations/*.sql\`  vs  ledger: \`audit_loop_migrations\`"
            echo ""
            echo '```json'
            cat /tmp/migration-drift.json
            echo '```'
            echo ""
            echo "### Recovery"
            echo ""
            echo "Run \`AUDIT_DB_URL=… node scripts/setup-postgres.mjs --migrate\` to apply pending migrations."
            echo "See AGENTS.md \"Migration-drift detection\" for the full runbook."
          } > /tmp/issue-body.md
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          printf '\n\n---\n_Auto-generated by `.github/workflows/migration-drift.yml` — [run](%s)._ ' "$RUN_URL" >> /tmp/issue-body.md
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue edit "$EXISTING" --body-file /tmp/issue-body.md --repo "$REPO"
            gh issue comment "$EXISTING" --repo "$REPO" --body "Re-triggered on $(date -u +%Y-%m-%d). See [workflow run]($RUN_URL)."
          else
            gh label create migration-drift --color D93F0B --description 'Migration drift trigger fired' --repo "$REPO" 2>/dev/null || true
            gh issue create --repo "$REPO" \
              --title "migration-drift: trigger fired ($(date -u +%Y-%m-%d))" \
              --label migration-drift \
              --body-file /tmp/issue-body.md
          fi

      - name: Auto-close sticky issue if green
        if: steps.drift.outputs.status == 'green'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh api "repos/$REPO/issues?state=open&labels=migration-drift&per_page=50" \
            --jq '[.[] | select(.body // "" | startswith("<!-- audit-loop:migration-drift -->"))][0].number' 2>/dev/null || echo '')
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "Drift returned to green on $(date -u +%Y-%m-%d). Auto-closing — reopen if a regression is observed."
            gh issue close "$EXISTING" --repo "$REPO"
          fi
