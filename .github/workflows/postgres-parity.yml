name: postgres-parity

# Plan §9 CI topology + §7 P4 row ".github/workflows/postgres-parity.yml".
#
# ROLE (corrected 2026-07-20 — read this before assuming what covers what).
#
# This job was once the SOLE gate for the pg-driver path, justified by "the
# maintainer never runs it locally, so the gate cannot depend on a local
# environment". That justification has expired: `scripts/db-test-container.mjs`
# provisions the same ephemeral pgvector container locally, and
# `db:suites:gate` runs these suites inside `npm run check`. Local coverage is
# now real.
#
# The expiry is the lesson worth keeping. That premise was a claim about a
# PERSON'S HABITS, not a property of the code, so no gate could ever test it —
# it aged silently while continuing to justify a live design decision. Every
# other load-bearing invariant in this repo is mechanically checkable; prefer
# that, and date any justification that is not.
#
# What this job is FOR now: the clean-environment guarantee a dev machine
# cannot give — fresh clone, `npm ci`, no local state, no
# already-applied-migration history, LF checkout. It catches the
# tracked-file/CRLF/missing-dep class that a warm working tree hides. It is a
# SECOND opinion, no longer the only one.
#
# Its weakness is observability, not correctness: this workflow failed 20
# consecutive runs (2026-07-18 → 07-20) with nobody noticing, because a remote
# gate has no forcing function. `.githooks/pre-push` §1.5 now surfaces a red
# run at push time. A gate nobody watches is not a gate.
#
# Two jobs:
#   unit     — pure tests (no DB). Runs on every PR.
#   db-suite — postgres+pgvector service container; sets AUDIT_DB_URL;
#              runs the env-gated DB tests (db-date-parser, db-withtx,
#              db-setup, learning-store-contract scaffold).

on:
  pull_request:
    paths:
      - 'scripts/lib/db/**'
      - 'scripts/lib/store/**'
      - 'scripts/setup-postgres.mjs'
      - 'scripts/learning-store.mjs'
      - 'supabase/migrations/**'
      - 'tests/db-*.test.mjs'
      - 'tests/learning-store-*.test.mjs'
      - 'tests/sync-packaging.test.mjs'
      - 'tests/fixtures/expected-schema.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/postgres-parity.yml'
  push:
    branches: [main]
    # Mirror the pull_request path filter — a direct push to main only runs
    # the DB-container suite when DB code / migrations / deps actually change.
    # Without this the suite ran on EVERY main push (the dominant Actions cost).
    paths:
      - 'scripts/lib/db/**'
      - 'scripts/lib/store/**'
      - 'scripts/setup-postgres.mjs'
      - 'scripts/learning-store.mjs'
      - 'supabase/migrations/**'
      - 'tests/db-*.test.mjs'
      - 'tests/learning-store-*.test.mjs'
      - 'tests/sync-packaging.test.mjs'
      - 'tests/fixtures/expected-schema.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/postgres-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      # Run only the postgres-parity-touching tests so this job stays fast.
      # The full suite runs separately via the repo's existing `npm test`.
      - name: Unit tests (no DB)
        run: |
          node --test \
            tests/db-query.test.mjs \
            tests/db-config-resolver.test.mjs \
            tests/db-setup.test.mjs \
            tests/learning-store-exports.test.mjs \
            tests/learning-store-contract.test.mjs \
            tests/sync-packaging.test.mjs

  db-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # pgvector base image — Postgres 16 with the `vector` extension
        # pre-installed. `pg_trgm` ships with stock Postgres; `pgcrypto`
        # is added by the compat-bootstrap.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    # AUDIT_DB_URL is deliberately NOT job-level env. assertDisposableDbUrl
    # (added after the 2026-07-14 production wipe) refuses to run the
    # destructive integration suites when AUDIT_DB_TEST_URL is identical to
    # AUDIT_DB_URL — the exact aliasing that caused the wipe. In this job
    # both would point at the same disposable container, so a job-level
    # AUDIT_DB_URL false-positives that guard. Instead, only the steps that
    # operate on "the database" (migrate / schema-diff / contract suite) get
    # AUDIT_DB_URL; the destructive test step sees only AUDIT_DB_TEST_URL,
    # which is the guard's intended contract.
    env:
      AUDIT_DB_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      AUDIT_DB_SSL_MODE: disable  # in-container, no TLS needed

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts

      - name: Apply migrations + compat-bootstrap (setup-postgres --migrate)
        env:
          AUDIT_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node scripts/setup-postgres.mjs --migrate

      - name: Verify schema matches the committed manifest
        env:
          AUDIT_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          # Generate a live manifest from the freshly-migrated DB, then diff
          # it against the committed tests/fixtures/expected-schema.json.
          # Any drift = the committed manifest is stale or the migrations
          # changed shape without re-recording.
          node scripts/postgres-parity/generate-expected-schema.mjs --out /tmp/live-schema.json
          # Use the script's own diff helper via node — keeps the comparator
          # logic in one place (scripts/setup-postgres.mjs _internals.diffSchemas).
          node --input-type=module -e "
            const fs = await import('node:fs');
            const { _internals } = await import('./scripts/setup-postgres.mjs');
            const expected = JSON.parse(fs.readFileSync('tests/fixtures/expected-schema.json', 'utf-8'));
            const live = JSON.parse(fs.readFileSync('/tmp/live-schema.json', 'utf-8'));
            const diff = _internals.diffSchemas(expected, live);
            if (diff.length > 0) {
              console.error('SCHEMA DRIFT:', JSON.stringify(diff, null, 2));
              process.exit(1);
            }
            console.log('manifest matches live schema');
          " || exit 1

      - name: Upload live schema artefact (diagnostic — always, so drift is downloadable without a live-repro session)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-schema
          path: /tmp/live-schema.json
          retention-days: 14

      - name: Duplicate-justification integration (needs the migrated schema INTACT)
        # OWN step, deliberately run BEFORE the schema-emptying step below —
        # NOT positioned via file ORDER in a shared `node --test` invocation.
        # Found 2026-07-15 (the wine-cellar-app upstream bug report
        # investigation): `node --test file-a.mjs file-b.mjs` does NOT run
        # files in the given CLI order — it sorts them ALPHABETICALLY by
        # path, even under --test-concurrency=1. This file
        # (symbol-index-drift-justification.test.mjs — previously wired into
        # NO CI job at all) was placed BEFORE db-setup.test.mjs in that
        # step's argument list on the reasoning "db-setup stays last", but
        # alphabetically `db-setup` < `symbol-index...`, so it actually ran
        # AFTER db-setup's DROP SCHEMA PUBLIC CASCADE every time — failing
        # its before() hook with `relation "audit_repos" does not exist`
        # (silently, until printed here — isCloudEnabled() swallows the
        # real error into a bare `false`, see the CANNOT read properties of
        # null this produced downstream). A separate step has no such
        # ordering hazard to get wrong again. AUDIT_DB_TEST_URL is already
        # job-level — no step env needed.
        #
        # Two more files join this step for the same reason — each needs an
        # intact, fully migrated schema BEFORE db-setup drops it:
        #   - db-schema-realization-live: needs a fully migrated ledger to
        #     evict a row from.
        #   - regression-spec-multi-finding-lock: round-trips two `unit-test`
        #     locks through the real partial-index arbiters, so it needs
        #     `regression_specs` to exist.
        # --test-concurrency=1 because all three share this job's single
        # Postgres.
        run: |
          node --test --test-concurrency=1 \
            tests/campaign-adjudication.test.mjs \
            tests/campaign-promote.test.mjs \
            tests/candidate-audit-findings-window.test.mjs \
            tests/db-schema-realization-live.test.mjs \
            tests/final-review-adjudicate.test.mjs \
            tests/graph-coverage-db.test.mjs \
            tests/mark-findings-remediation.test.mjs \
            tests/on-conflict-scope-identity.test.mjs \
            tests/persist-kept-embeddings.test.mjs \
            tests/persona-outcomes-hash-backfill.test.mjs \
            tests/plans-ship-persona-correlation.test.mjs \
            tests/refresh-provenance-promotion.test.mjs \
            tests/refresh-runs-repo-scoping.test.mjs \
            tests/regression-spec-multi-finding-lock.test.mjs \
            tests/repo-identity-store.test.mjs \
            tests/repo-last-audited-at.test.mjs \
            tests/setup-postgres-surface-precondition.test.mjs \
            tests/store-ownership-db.test.mjs \
            tests/symbol-embeddings-rowcount.test.mjs \
            tests/symbol-file-imports.test.mjs \
            tests/symbol-index-drift-justification.test.mjs \
            tests/model-eval-comparison-store.test.mjs \
            tests/symbols-count-for-snapshot.test.mjs \
            tests/unremediated-acceptance-disposition.test.mjs

      - name: Env-gated DB tests (G1 date parser + G3 withTx + setup integration)
        # --test-concurrency=1 is LOAD-BEARING: node --test runs each test
        # file in its own process CONCURRENTLY by default, but both files
        # share this job's single Postgres. Safe regardless of the ACTUAL
        # (alphabetical, not argument-order — see above) execution order
        # here specifically because db-withtx.test.mjs's before() hook is
        # self-contained (CREATE TABLE IF NOT EXISTS on its own throwaway
        # table, no dependency on audit_repos/symbol_index/etc existing) —
        # it tolerates db-setup having just emptied the schema. This is NOT
        # a general safety property of file-list ordering in this step; a
        # future addition here must independently verify it's equally
        # schema-empty-tolerant, or get its own step like the one above.
        # (--test-concurrency=1 itself is still load-bearing for a DIFFERENT
        # reason: db-withtx's CREATE TABLE landing in the window where
        # `public` doesn't exist yet → 3F000 "no schema has been selected to
        # create in" — this exact race also wiped the production store on
        # 2026-07-14 when AUDIT_DB_TEST_URL pointed at it, see
        # assertDisposableDbUrl.)
        run: |
          node --test --test-concurrency=1 \
            tests/db-date-parser.test.mjs \
            tests/db-withtx.test.mjs \
            tests/db-setup.test.mjs \
            tests/repair-eol.integration.test.mjs

      - name: Contract suite — public-surface assertions
        # Source-level only: asserts the 93-function contract surface is
        # still reachable through the learning-store barrel. No DB access —
        # it runs here purely to keep the parity gates in one job. The
        # golden-fixture parity half was retired (see the suite's header
        # comment); forward pg-path regression coverage is the db-* and
        # store-* suites above.
        run: node --test tests/learning-store-contract.test.mjs
