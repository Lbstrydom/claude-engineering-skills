name: architectural-drift

# Weekly architectural drift sweep + retention prune.
# Mirrors memory-health.yml's sticky-issue + auto-close pattern.

on:
  schedule:
    # Mondays 09:30 UTC — 30-min stagger from memory-health
    - cron: '30 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: architectural-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Postgres DSN present
        id: secrets-check
        env:
          AUDIT_DB_URL: ${{ secrets.AUDIT_DB_URL }}
        run: |
          if [ -z "$AUDIT_DB_URL" ]; then
            echo "::warning::AUDIT_DB_URL not set — skipping architectural-drift"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # NOT `|| true`. A swallowed refresh failure does not merely lose a log
      # line — it lets every step below run against a STALE index, and a
      # stale-data `green` reaches "Auto-close sticky issue if green" and
      # closes a real drift issue. A failure that launders into a clean verdict
      # is the capture-dishonesty class this repo exists to catch, and it was
      # sitting in the job whose whole purpose is detecting drift.
      #
      # Failing here stops the job before the sweep, so there is no verdict, no
      # artefact and no issue churn — the honest outcome for a run that could
      # not establish its own inputs. A weekly job going red IS the signal.
      - name: Refresh architectural memory (full)
        id: refresh
        if: steps.secrets-check.outputs.skip != 'true'
        env:
          AUDIT_DB_URL: ${{ secrets.AUDIT_DB_URL }}
          AUDIT_DB_SSL_MODE: no-verify
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run arch:refresh:full

      - name: Run drift sweep
        if: steps.secrets-check.outputs.skip != 'true'
        id: drift
        env:
          AUDIT_DB_URL: ${{ secrets.AUDIT_DB_URL }}
          AUDIT_DB_SSL_MODE: no-verify
        run: |
          set +e
          node scripts/symbol-index/drift.mjs --out /tmp/architectural-drift.md
          EXIT=$?
          set -e
          echo "exit=$EXIT" >> "$GITHUB_OUTPUT"
          if [ "$EXIT" = "0" ]; then echo "status=green" >> "$GITHUB_OUTPUT";
          elif [ "$EXIT" = "1" ]; then echo "status=triggered" >> "$GITHUB_OUTPUT";
          else echo "status=error" >> "$GITHUB_OUTPUT"; fi

      # `continue-on-error`, NOT `|| true`. Both tolerate a failure; only one
      # SHOWS it. `|| true` reports success to Actions and the step renders
      # green, so a prune that has been broken for months looks identical to
      # one that ran. This surfaces as a failed-but-tolerated step.
      #
      # Tolerated because retention pruning cannot corrupt the verdict: it runs
      # AFTER the sweep, and its failure means old rows linger — a housekeeping
      # cost, not a wrong answer. That is the actual test for `|| true`, and
      # the refresh above fails it while this passes.
      - name: Run retention prune
        if: steps.secrets-check.outputs.skip != 'true'
        continue-on-error: true
        env:
          AUDIT_DB_URL: ${{ secrets.AUDIT_DB_URL }}
          AUDIT_DB_SSL_MODE: no-verify
        run: npm run arch:prune

      # Do NOT re-add a hashFiles() guard here: hashFiles resolves relative to
      # GITHUB_WORKSPACE and cannot see /tmp, so the predicate was ALWAYS empty
      # and this step silently skipped on every run from #1 to #17 — the report
      # has never once been uploaded. Verified 2026-08-08 against run 30806755604
      # ("Upload report artefact | skipped" with the drift sweep green) and a
      # zero artifact count across the sampled run history. `if-no-files-found`
      # covers the absent-report case that guard was reaching for.
      - name: Upload report artefact
        if: steps.secrets-check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: architectural-drift-report
          path: /tmp/architectural-drift.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Open / update sticky issue on trigger
        if: steps.drift.outputs.status == 'triggered'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          MARKER='<!-- audit-loop:architectural-drift -->'
          EXISTING=$(gh api "repos/$REPO/issues?state=open&labels=architectural-drift&per_page=50" \
            --jq '[.[] | select(.body // "" | startswith("<!-- audit-loop:architectural-drift -->"))][0].number' 2>/dev/null || echo '')
          BODY=$(cat /tmp/architectural-drift.md)
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          FOOTER=$'\n\n---\n_Auto-generated by `.github/workflows/architectural-drift.yml` — ['"run"']('"$RUN_URL"')._ '
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            printf '%s%s' "$BODY" "$FOOTER" > /tmp/issue-body.md
            gh issue edit "$EXISTING" --body-file /tmp/issue-body.md --repo "$REPO"
            gh issue comment "$EXISTING" --repo "$REPO" --body "Re-triggered on $(date -u +%Y-%m-%d). See [workflow run]($RUN_URL)."
          else
            printf '%s%s' "$BODY" "$FOOTER" > /tmp/issue-body.md
            gh label create architectural-drift --color D93F0B --description 'Architectural drift trigger fired' --repo "$REPO" 2>/dev/null || true
            gh issue create --repo "$REPO" \
              --title "architectural-drift: trigger fired ($(date -u +%Y-%m-%d))" \
              --label architectural-drift \
              --body-file /tmp/issue-body.md
          fi

      # The `steps.refresh.outcome` clause is belt-and-braces, and deliberately
      # kept even though removing `|| true` above already prevents this step
      # from being reached on a failed refresh (the job stops first). It is the
      # guard that survives a future edit re-adding tolerance to the refresh:
      # auto-closing is the only IRREVERSIBLE action in this workflow, so it is
      # the one that must never fire on an index whose freshness is unproven.
      # Closing a real drift issue on stale data is silent and unrecoverable;
      # leaving one open costs a week.
      - name: Auto-close sticky issue if green
        if: steps.drift.outputs.status == 'green' && steps.refresh.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh api "repos/$REPO/issues?state=open&labels=architectural-drift&per_page=50" \
            --jq '[.[] | select(.body // "" | startswith("<!-- audit-loop:architectural-drift -->"))][0].number' 2>/dev/null || echo '')
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "Drift returned to green on $(date -u +%Y-%m-%d). Auto-closing — reopen if a regression is observed."
            gh issue close "$EXISTING" --repo "$REPO"
          fi

      - name: Fail workflow on infra error
        if: steps.drift.outputs.status == 'error'
        run: |
          echo "::error::drift script failed with exit code 2 (infra error, not a drift signal)"
          exit 1
