name: learning-weekly-review

# Weekly review of the adaptive-learning system's pending-triage findings,
# no-brainer recurring clusters, and stale deferrals. Posts a sticky GitHub
# issue (label: learning-weekly-review) with the per-repo digest.
#
# Plan: docs/plans/adaptive-learning-phase-1-foundation.md

on:
  schedule:
    # Mondays 09:00 UTC — same cadence as memory-health.yml
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      repo-name:
        description: 'Repo name in owner/repo form (defaults to github.repository)'
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: learning-weekly-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Postgres DSN present
        id: secrets-check
        env:
          AUDIT_DB_URL: ${{ secrets.AUDIT_DB_URL }}
        run: |
          if [ -z "$AUDIT_DB_URL" ]; then
            echo "::warning::AUDIT_DB_URL not set — skipping review"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Phase 2: backfill quickfix outcomes BEFORE the review reads stats.
      # Drains hits.jsonl into learning_decisions, resolves >30min unresolved
      # outcomes from current file state, then rebuilds the pattern-stats cache.
      - name: Backfill quickfix outcomes
        if: steps.secrets-check.outputs.skip != 'true'
        env:
          AUDIT_DB_URL: ${{ secrets.AUDIT_DB_URL }}
          AUDIT_DB_SSL_MODE: no-verify
        run: |
          set +e
          node scripts/cross-skill.mjs learning-backfill-outcomes --rebuild-stats
          # Treat backfill failures as warnings — the review can still run
          # against whatever data is already in learning_decisions.
          if [ $? -ne 0 ]; then
            echo "::warning::backfill-outcomes failed; weekly review will use prior cache state"
          fi

      - name: Run weekly review
        if: steps.secrets-check.outputs.skip != 'true'
        env:
          AUDIT_DB_URL: ${{ secrets.AUDIT_DB_URL }}
          AUDIT_DB_SSL_MODE: no-verify
          # Per-repo scoping: weekly-review.mjs aborts if LEARNING_REPO_NAME
          # is missing. audit_repos.name is the owner/repo slug derived from
          # the git origin URL (resolveRepoIdentity/deriveName) — the bare
          # github.event.repository.name never matches it (found 2026-07-22:
          # every run silently read {posted:false, reason:'unknown-repo'}).
          LEARNING_REPO_NAME: ${{ inputs.repo-name || github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Stdout is JSON (the digest envelope); stderr carries the markdown
          # body (which weekly-review.mjs also posts to the sticky issue).
          node scripts/cross-skill.mjs learning-weekly-review --repo "$LEARNING_REPO_NAME"
