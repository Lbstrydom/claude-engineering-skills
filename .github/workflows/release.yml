name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Determine tag
        id: tag
        # The dispatch input is DATA: it reaches the shell through the environment, never by interpolating the
        # expression into the script text (a value like `v1.0.0$(id)` would otherwise run), and it is validated before
        # any later step reads it.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "refusing release tag that is not vMAJOR.MINOR.PATCH[-suffix]" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build manifest
        run: node scripts/build-manifest.mjs

      - name: Build checksums
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node -e "
          import fs from 'fs';
          import crypto from 'crypto';
          import path from 'path';

          const tag = process.env.RELEASE_TAG;
          if (!tag) throw new Error('RELEASE_TAG is not set');
          const manifest = JSON.parse(fs.readFileSync('skills.manifest.json', 'utf-8'));
          const files = {};

          // Hash all skills
          for (const [name, meta] of Object.entries(manifest.skills)) {
            const content = fs.readFileSync(meta.path);
            files[meta.path] = 'sha256-' + crypto.createHash('sha256').update(content).digest('hex');
          }

          // Hash key scripts
          const scriptPaths = [
            'scripts/install-skills.mjs',
            'scripts/build-manifest.mjs',
            'skills.manifest.json',
          ];
          // Every listed path is REQUIRED: readFileSync throws on a missing one, so a renamed or deleted script fails
          // the release instead of being silently dropped from checksums.json (it was: check-skill-updates.mjs).
          for (const sp of scriptPaths) {
            const content = fs.readFileSync(sp);
            files[sp] = 'sha256-' + crypto.createHash('sha256').update(content).digest('hex');
          }

          const checksums = {
            version: tag,
            releasedAt: new Date().toISOString(),
            bundleVersion: manifest.bundleVersion,
            files,
          };

          fs.writeFileSync('checksums.json', JSON.stringify(checksums, null, 2));
          console.log('checksums.json written with', Object.keys(files).length, 'files');
          " --input-type=module

      - name: Create skills bundle tarball
        run: tar -czf skills-bundle.tar.gz skills/ scripts/install-skills.mjs skills.manifest.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums
        run: cosign sign-blob --yes --output-signature checksums.json.sig --output-certificate checksums.json.pem checksums.json

      - name: Sign installer
        run: cosign sign-blob --yes --output-signature install-skills.mjs.sig --output-certificate install-skills.mjs.pem scripts/install-skills.mjs

      - name: Generate attestation
        uses: actions/attest-build-provenance@bdd51370e0416ac948727f861e03c2f05d32d7f0 # v1.3.2
        with:
          subject-path: checksums.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            checksums.json
            checksums.json.sig
            checksums.json.pem
            install-skills.mjs.sig
            install-skills.mjs.pem
            skills-bundle.tar.gz
            scripts/install-skills.mjs
