name: full-suite

# The ONE full test run per PR for this repo (docs/plans/ci-full-suite-actions.md). It replaces the full local
# pre-push suite on the shared machine: a local CES push now takes the branch tier (static gates + light tests + the
# heavy files the diff reaches), and this job supplies the full verdict that merge rule 8 reads
# (`node scripts/test-tier.mjs ci-verdict --pr <n>`).
#
# BUDGET (hard constraints, enforced by tests/workflow-runner-labels.test.mjs):
#   - STANDARD GitHub-hosted runners only (`ubuntu-latest`, `windows-latest`). This repo is PUBLIC, and Actions usage is
#     free for "public repositories that use standard GitHub-hosted runners"
#     (docs.github.com/en/billing/concepts/product-billing/github-actions). A larger runner is billed even here.
#   - No uploaded artifacts, no actions/cache, no `cache:` on setup-node: storage billing for public repos is not clearly
#     free, and a 563 s suite does not need either.
#   - A superseded run is cancelled, so pushes to one PR never pile up.
#
# WHAT IT DOES NOT RUN: `npm run check:static`. Those gates read gitignored inputs that the local pre-push sandbox
# provisions (measured 2026-10-14: its first gate fails on ~40 references to files a fresh clone lacks), so they stay in
# the local gate, in both tiers.
#
# No secrets and no database: the DB-gated suites skip themselves exactly as in a local `npm test`; the DB seam keeps its
# own disposable-container job in postgres-parity.yml.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # gate-provenance reads labels and reviews of the PR

jobs:
  full-suite:
    name: full-suite
    runs-on: ubuntu-latest
    # 3x the measured job (9.6 min on 2026-10-14).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Several tests build throwaway git repos and commit into them.
      - name: Git identity for throwaway test repos
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      # Gate provenance, OBSERVE mode (the verification-lessons plan, section 2.2). It runs BEFORE the PR `npm ci`, so no
      # lifecycle script of the PR has executed when the base is judged. The runner itself comes from a detached worktree of
      # the immutable base sha with the dependencies of THE BASE (`npm ci --ignore-scripts`); a PR that edits the runner,
      # the registry or the classifier cannot change how it is judged. The analyzed head is the PR head sha (not the merge
      # commit), so a standing review can be bound to it. Observe mode exits 0 by design (no continue-on-error is needed);
      # a failed base install, an unfetchable base and the bootstrap PR (no runner at the base) each print an
      # `unmeasured` notice and let the job continue.
      - name: Gate provenance (observe)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          notice() { echo "::notice title=audit-loop-gate-provenance::$1"; }
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            notice "state=unmeasured | base sha $BASE_SHA is not fetchable"
            exit 0
          fi
          # The PR head is a parent of the checked-out merge commit; fetch it explicitly rather than assume the clone holds it.
          if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$HEAD_SHA" || true
          fi
          if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            notice "state=unmeasured | head sha $HEAD_SHA is not fetchable"
            exit 0
          fi
          BASE_WT="$RUNNER_TEMP/gate-provenance-base"
          if ! git worktree add --detach "$BASE_WT" "$BASE_SHA"; then
            notice "state=unmeasured | could not create the base worktree"
            exit 0
          fi
          if [ ! -f "$BASE_WT/scripts/gate-provenance.mjs" ]; then
            notice "state=unmeasured | the base has no scripts/gate-provenance.mjs (bootstrap PR: the one change that cannot be judged by base code)"
          elif ! (cd "$BASE_WT" && npm ci --ignore-scripts --no-audit --no-fund); then
            notice "unmeasured (base install failed: npm ci --ignore-scripts exited non-zero in the base worktree)"
          else
            node "$BASE_WT/scripts/gate-provenance.mjs" --repo-root "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" --base-install-dir "$BASE_WT" --pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --mode observe || notice "state=unmeasured | the runner exited non-zero in observe mode"
          fi
          git worktree remove --force "$BASE_WT" || true

      - run: npm ci

      # tests/visual-extract.test.mjs fails (by design) when Chromium is missing in CI.
      - name: Install Chromium for the extract integration test
        run: npx playwright install --with-deps chromium

      # TEST_TIMING_KEEP makes the runner copy its per-file timing report to a file on THIS runner (never uploaded). The next
      # step prints it into the job summary and the log, so a baseline refresh of .test-tiers.json can read per-file
      # timings from CI (`node scripts/test-tier.mjs refresh-heavy --timing <saved log>`) instead of a 16-minute local run.
      - name: npm test
        env:
          TEST_TIMING_KEEP: ${{ runner.temp }}/test-timing.json
        run: npm test

      # Observation only, and it must never change the verdict: `if: always()` so a failing suite still reports, and the
      # command's own non-zero exit (a missing or partial report) is turned into a notice, and `continue-on-error` plus `|| true`
      # on the prints mean nothing in this step (a full disk, a summary-size limit) can turn the job red. The step takes
      # seconds; no artifact, no cache, no extra job.
      - name: Test timing report (job summary)
        if: always()
        continue-on-error: true
        env:
          TIMING_FILE: ${{ runner.temp }}/test-timing.json
        run: |
          if node scripts/test-tier.mjs timing-summary --timing "$TIMING_FILE" > "$RUNNER_TEMP/timing-summary.md"; then
            cat "$RUNNER_TEMP/timing-summary.md" || true
            cat "$RUNNER_TEMP/timing-summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "::notice title=audit-loop-no-measurement::test timing report unavailable or partial; no per-file timings from this run"
          fi
