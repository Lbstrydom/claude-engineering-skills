<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>nav-live fixture</title>
<style>
  /* desktop sidebar visible ≥700px; mobile bottom-nav visible <700px */
  #primary-nav { display: none; }
  .sub-tabs-row { display: block; }
  @media (max-width: 699px) {
    #desktop-sidebar { display: none; }
    #primary-nav { display: block; }
  }
  @media (min-width: 700px) {
    #desktop-sidebar { display: block; }
  }
</style>
</head>
<body>
  <!-- Desktop sidebar (primary on desktop) -->
  <nav id="desktop-sidebar">
    <a href="?view=wines">Wines</a>
    <a href="?view=pairing">Pairing</a>
  </nav>

  <!-- Mobile bottom nav (primary on mobile) — buttons with data-nav-view, NO href,
       NO role/aria — exactly the wine-cellar-app pattern the v1.2 fix targets. -->
  <div id="primary-nav">
    <button data-nav-view="today" data-nav-id="today">Today</button>
    <button data-nav-view="wines" data-nav-id="wines">Wines</button>
    <button data-nav-id="scan">Scan</button> <!-- action button: NO target → must be skipped -->
  </div>

  <!-- Secondary sub-tabs (always present) -->
  <div class="sub-tabs-row">
    <a href="?view=grid">Grid</a>
    <a href="?view=drinksoon">Drink Soon</a>
  </div>

  <!-- A target-bearing button OUTSIDE any declared nav container -->
  <main>
    <button data-route="promo">Promo</button>
  </main>
</body>
</html>
